<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="research-gap-to-idea">
  <title>{{TITLE}}</title>
  <style>
    :root { --ink:#172033; --muted:#64748b; --line:#dbe4ef; --paper:#ffffff; --wash:#f5f8fc; --navy:#17324d; --blue:#2d6cdf; --teal:#087f8c; --amber:#a45c00; --red:#a33838; --green:#26734d; --shadow:0 12px 32px rgba(23,50,77,.08); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--wash); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; line-height:1.7; }
    .shell { display:grid; grid-template-columns:minmax(190px,240px) minmax(0,1fr); max-width:1500px; margin:0 auto; min-height:100vh; }
    .sidebar { position:sticky; top:0; align-self:start; height:100vh; overflow:auto; padding:28px 18px; background:var(--navy); color:#e8f0f8; }
    .brand { font-weight:750; letter-spacing:.02em; margin-bottom:20px; }
    .brand small { display:block; color:#a9c1d8; font-weight:500; margin-top:4px; }
    .toc a { display:block; color:#c9d7e6; text-decoration:none; font-size:13px; padding:5px 7px; border-radius:6px; }
    .toc a:hover { background:rgba(255,255,255,.1); color:#fff; }
    .toc .toc-h3 { padding-left:18px; font-size:12px; color:#9fb5ca; }
    main { min-width:0; padding:44px clamp(22px,5vw,78px) 80px; }
    .hero { max-width:980px; margin:0 auto 34px; padding:32px 36px; background:linear-gradient(135deg,#17324d,#23587a); color:#fff; border-radius:18px; box-shadow:var(--shadow); }
    .hero h1 { margin:0; line-height:1.25; font-size:clamp(28px,4vw,46px); }
    .hero p { color:#dbeafe; margin:14px 0 0; }
    .content { max-width:980px; margin:0 auto; }
    h2 { margin:44px 0 16px; padding-top:10px; border-top:1px solid var(--line); color:var(--navy); font-size:clamp(22px,3vw,30px); }
    h3 { margin:28px 0 10px; color:#1d4e70; font-size:20px; }
    h4 { color:#356278; }
    p, ul, ol, blockquote, pre, table { margin:12px 0 18px; }
    a { color:var(--blue); }
    blockquote { margin-left:0; padding:12px 18px; border-left:4px solid var(--teal); background:#eaf7f8; color:#164e63; border-radius:0 9px 9px 0; }
    code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; background:#eef2f7; padding:2px 5px; border-radius:4px; font-size:.9em; }
    pre { overflow:auto; padding:17px 19px; background:#102033; color:#d9e6f2; border-radius:10px; line-height:1.5; }
    pre code { padding:0; background:transparent; color:inherit; }
    .table-wrap { overflow-x:auto; margin:16px 0 24px; border:1px solid var(--line); border-radius:10px; background:var(--paper); }
    table { width:100%; min-width:650px; border-collapse:collapse; margin:0; background:var(--paper); }
    th, td { padding:10px 12px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line); }
    th { background:#edf4fa; color:var(--navy); font-size:13px; }
    tr:last-child td { border-bottom:0; }
    .paper-card, .idea-card { margin:22px 0; background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
    .paper-card summary, .idea-card summary { cursor:pointer; list-style:none; padding:16px 20px; font-weight:750; color:var(--navy); background:linear-gradient(90deg,#eef6fb,#fff); }
    .paper-card summary::-webkit-details-marker, .idea-card summary::-webkit-details-marker { display:none; }
    .paper-card summary::before, .idea-card summary::before { content:'＋'; display:inline-block; width:22px; color:var(--teal); }
    .paper-card[open] summary::before, .idea-card[open] summary::before { content:'−'; }
    .paper-card > :not(summary), .idea-card > :not(summary) { margin-left:20px; margin-right:20px; }
    .idea-card { border-left:5px solid var(--amber); }
    .evidence { display:inline-block; padding:0 5px; border-radius:4px; font-weight:700; font-size:.82em; }
    .evidence-d { color:var(--green); background:#e7f6ed; }
    .evidence-c { color:#176a83; background:#e4f5f8; }
    .evidence-l { color:#6b4d9b; background:#f0eafe; }
    .evidence-u { color:var(--red); background:#fdecec; }
    .callout { padding:14px 18px; background:#fff8e8; border-left:4px solid #d38b22; border-radius:0 8px 8px 0; }
    .footer { max-width:980px; margin:38px auto 0; color:var(--muted); font-size:12px; }
    @media (max-width:850px) { .shell { display:block; } .sidebar { position:sticky; top:0; z-index:2; height:auto; max-height:220px; overflow:auto; padding:14px 18px; } .brand { margin-bottom:8px; } .toc { display:flex; flex-wrap:wrap; gap:2px 8px; } .toc a { padding:3px 5px; } .toc .toc-h3 { padding-left:5px; } main { padding:25px 16px 50px; } .hero { padding:24px 22px; border-radius:12px; } }
    @media print { body { background:#fff; } .shell { display:block; } .sidebar { display:none; } main { padding:0; } .hero { color:#000; background:#fff; box-shadow:none; border:1px solid #bbb; } .hero p { color:#333; } .paper-card, .idea-card { box-shadow:none; break-inside:avoid; } .paper-card, .idea-card { border:1px solid #aaa; } .paper-card[open] summary, .idea-card[open] summary { border-bottom:1px solid #ccc; } a { color:#000; text-decoration:none; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">Research Gap to Idea<small>Evidence-bounded synthesis</small></div>
      <nav class="toc">{{TOC}}</nav>
    </aside>
    <main>
      <header class="hero">
        <h1>{{TITLE}}</h1>
        <p>Generated from the accompanying Markdown report. Evidence status, source boundaries, and unresolved links are preserved.</p>
      </header>
      <article class="content">{{CONTENT}}</article>
      <div class="footer">Generated by research-gap-to-idea · single-file offline report</div>
    </main>
  </div>
</body>
</html>
